name: Risk Review Gate
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
permissions: {contents: read}
concurrency: {group: 'risk-review-${{ github.event.pull_request.number }}', cancel-in-progress: true}
jobs:
  risk-review-gate:
    uses: caty-ai/family-dev-handbook/.github/workflows/reusable-review-labels.yml@ci-v1
    permissions: {contents: read, issues: read, pull-requests: write}
    with:
      risk_paths_billing: 'none'   # no payment/spend code in this repo (recorded 2026-08-20, #21)
      risk_paths_outbound: 'bin/recall'  # recall sends query text to api.supermemory.ai (owner-configured backend) — declared fail-closed
      risk_paths_gates: |
        .github/workflows/**
        .github/risk-reviewers.txt
        Makefile
        tests/run.sh
        hooks/**
      risk_paths_auth: 'none'      # no auth boundary — the reusable's AUTH self-check warning is the recorded no-auth confirmation
